
name: Lab 6 Coverage Tests

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Lab 6

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install pytest coverage

      - name: Run code coverage tests
        run: |
          python -m coverage run --source=amusement_park_ride_access -m pytest -q CodeCoverageTest_park_application.py
          python -m coverage report -m

      - name: Run branch coverage tests
        run: |
          python -m coverage erase
          python -m coverage run --branch --source=amusement_park_ride_access -m pytest -q BranchCoverageTest_park_application.py
          python -m coverage report -m
